<div class="py-1 overflow-auto inline-block w-full">
  <span class="text-[12px] text-(--metatext-color) uppercase align-middle">
    {{ page_content.date | date: "%B %-d, %Y" }}
  </span>
  <span class="text-[12px] text-(--metatext-color) uppercase align-middle">-</span>
  <span class="text-[12px] text-(--metatext-color) uppercase align-middle">
    {% capture words %}
      {{ page_content.content | number_of_words }}
    {% endcapture %}
    {% unless words contains "-" %}
      {{ words | plus: 250 | divided_by: 250 | append: " min read" }}
    {% endunless %}
  </span>
</div>
